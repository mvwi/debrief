[project]
# "debrief" is taken on PyPI. The command and the import package are still `debrief`.
name = "debrief-cli"
version = "0.1.1"
description = "Review your coding-agent sessions: what went wrong, and what to change."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["coding-agent", "claude-code", "codex", "session-logs", "report"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[project.urls]
Homepage = "https://github.com/mvwi/debrief"
Issues = "https://github.com/mvwi/debrief/issues"

[project.scripts]
debrief = "debrief.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["debrief"]

# Keeps uv.lock out. pyproject.toml, the readme and a root LICENSE* go in regardless.
[tool.hatch.build.targets.sdist]
include = ["/debrief", "/tests"]

[tool.ruff]
line-length = 120

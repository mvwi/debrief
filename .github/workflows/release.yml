name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  DIST_NAME: debrief-cli # the name on PyPI; a rename changes this line and the PyPI trusted publisher
  TAP_REPO: mvwi/homebrew-tap
  TAP_FORMULA: Formula/debrief.rb
  TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --locked
      - name: Check the tag matches pyproject.toml
        id: version
        run: |
          version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
          # 1.2.3 is a full release; anything else (1.2.3rc1, 1.2.3.dev0) is a pre-release
          if [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      # A tag can point at a commit CI never ran on, and a PyPI upload cannot be undone.
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing; no stored token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            "--prerelease=$PRERELEASE"

  tap:
    needs: [build, pypi]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - name: Point the formula at the new sdist
        run: |
          sdist=$(basename dist/*.tar.gz)
          export URL="https://files.pythonhosted.org/packages/source/${DIST_NAME:0:1}/$DIST_NAME/$sdist"
          SHA=$(sha256sum "dist/$sdist" | cut -d' ' -f1)
          export SHA
          cd tap
          # No /g: only the first url and the first sha256, which are the formula's own.
          # The resource blocks below them keep theirs.
          perl -0pi -e 's|^(\s*url ).*$|$1"$ENV{URL}"|m; s|^(\s*sha256 ).*$|$1"$ENV{SHA}"|m' "$TAP_FORMULA"
          grep -qF "url \"$URL\"" "$TAP_FORMULA"
          grep -qF "sha256 \"$SHA\"" "$TAP_FORMULA"
          if git diff --quiet; then
            echo "formula already at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "debrief ${TAG#v}"
          git push
